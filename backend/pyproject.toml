[project]
name = "notes-agent-backend"
version = "0.5.4-alpha"
description = "Notes Agent 的 FastAPI 基础壳子"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "croniter>=6.0,<7.0",
    "cryptography>=45,<52",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "jsonschema>=4.25,<5.0",
    "olefile>=0.47",
    "mistune>=3.0,<4.0",
    "python-docx>=1.1,<2.0",
    "reportlab>=4.0,<5.0",
    "pyyaml>=6.0,<7.0",
    "referencing>=0.36,<1.0",
    "sqlite-vec>=0.1.9",
    "tzdata>=2026.1",
    "uvicorn[standard]>=0.35,<1.0",
    "matplotlib>=3.9,<4",
    "playwright>=1.55,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
]
packaging = [
    "pyinstaller>=6.16,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
