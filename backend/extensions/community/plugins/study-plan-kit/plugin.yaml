id: study-plan-kit
name: 学习冲刺规划工具
version: 1.0.0
description: 根据学习天数、每日时间和当前掌握度生成可核验的分阶段学习骨架，供 Agent 结合课程内容继续个性化。
permissions: []
contributes:
  tools: [study-plan-kit.build_sprint]
backend:
  type: mcp
  transport: stdio
  command: ./study-plan-kit.exe
  args: []
  startup_timeout_seconds: 10
  tool_timeout_seconds: 10
