id: mcp-fixture
name: MCP Fixture
version: 1.0.0
description: 阶段 C/D 离线联调 Fixture，覆盖 MCP Tool、Command 与错误边界。
permissions:
  - notes.read
  - secrets.use
contributes:
  tools:
    - mcp-fixture.echo
    - mcp-fixture.fail
    - mcp-fixture.sleep
    - mcp-fixture.large
    - mcp-fixture.environment
    - mcp-fixture.exit
  commands:
    - mcp-fixture.notify
  settings_sections:
    - mcp-fixture.general
backend:
  type: mcp
  transport: stdio
  command: python
  args: [server.py]
  startup_timeout_seconds: 5
  tool_timeout_seconds: 1
