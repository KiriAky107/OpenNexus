id: mcp-fixture
name: MCP Fixture
version: 1.0.0
description: 阶段 C 离线联调 Fixture，覆盖 MCP Tool 生命周期与错误边界。
permissions:
  - notes.read
contributes:
  tools:
    - mcp-fixture.echo
    - mcp-fixture.fail
    - mcp-fixture.sleep
    - mcp-fixture.large
    - mcp-fixture.environment
    - mcp-fixture.exit
backend:
  type: mcp
  transport: stdio
  command: python
  args: [server.py]
  startup_timeout_seconds: 5
  tool_timeout_seconds: 1
