name: Android

on:
  push:
    branches: [main]
    paths:
      - 'frontend/mobile/**'
      - 'frontend/src-tauri/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'scripts/*android*'
      - 'scripts/android-runtime/**'
      - 'frontend/src/components/common/**'
      - 'frontend/src/features/workspace/FileTreeNode.vue'
      - 'frontend/src/features/workspace/WorkspaceLanding.vue'
      - 'frontend/src/features/themes/ThemeCard.vue'
      - 'frontend/src/features/themes/ThemePreview.vue'
      - 'frontend/src/features/settings/SyncConnectionForm.vue'
      - 'frontend/src/features/settings/SyncVaultSelector.vue'
      - 'frontend/src/features/settings/syncVaults.ts'
      - 'frontend/src/features/settings/SyncInitialPreview.vue'
      - 'frontend/src/features/settings/SyncActivity.vue'
      - 'frontend/src/features/settings/SyncConflictContent.vue'
      - 'frontend/src/features/settings/SyncTextDiff.vue'
      - 'frontend/src/features/settings/syncDiff.ts'
      - 'frontend/src/contracts/sync.ts'
      - 'frontend/src/features/settings/syncPresentation.ts'
      - 'frontend/src/features/editor/**'
      - 'frontend/src/i18n.ts'
      - 'frontend/src/styles/**'
      - 'frontend/src/assets/opennexus-logo-dark.svg'
      - 'frontend/src/services/workspaceDocuments.ts'
      - 'frontend/src/services/vaultReferences.ts'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/mobile/**'
      - 'frontend/src-tauri/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'scripts/*android*'
      - 'scripts/android-runtime/**'
      - 'frontend/src/components/common/**'
      - 'frontend/src/features/workspace/FileTreeNode.vue'
      - 'frontend/src/features/workspace/WorkspaceLanding.vue'
      - 'frontend/src/features/themes/ThemeCard.vue'
      - 'frontend/src/features/themes/ThemePreview.vue'
      - 'frontend/src/features/settings/SyncConnectionForm.vue'
      - 'frontend/src/features/settings/SyncVaultSelector.vue'
      - 'frontend/src/features/settings/syncVaults.ts'
      - 'frontend/src/features/settings/SyncInitialPreview.vue'
      - 'frontend/src/features/settings/SyncActivity.vue'
      - 'frontend/src/features/settings/SyncConflictContent.vue'
      - 'frontend/src/features/settings/SyncTextDiff.vue'
      - 'frontend/src/features/settings/syncDiff.ts'
      - 'frontend/src/contracts/sync.ts'
      - 'frontend/src/features/settings/syncPresentation.ts'
      - 'frontend/src/features/editor/**'
      - 'frontend/src/i18n.ts'
      - 'frontend/src/styles/**'
      - 'frontend/src/assets/opennexus-logo-dark.svg'
      - 'frontend/src/services/workspaceDocuments.ts'
      - 'frontend/src/services/vaultReferences.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'Optional existing Android run with a successful debug-apk job; no APK rebuild'
        type: string
        required: false
      apk_commit:
        description: 'Full immutable source SHA for apk_run_id; supply both reuse fields together'
        type: string
        required: false
      runtime_scope:
        description: 'all checks, or a named remaining scope on an existing fixed APK without rebuilding'
        type: choice
        options: [all, lifecycle, lifecycle-remaining, lifecycle-editor-remaining, local-references, tablet, auth, auth-recovery, auth-background, auth-certificate, attachments, attachments-remaining, canvas-remaining, editing-remaining, canvas-tools, canvas-tablet, performance, document-limits, document-export, storage-recovery, canvas-storage-recovery, canvas-properties, canvas-properties-remaining, write-interruption, file-actions, file-actions-remaining, canvas-file-delete, note-search, canvas-graph, canvas-graph-remaining, canvas-motion, canvas-view, canvas-view-remaining, canvas-view-cold, offline-pending, offline-pending-final, offline-limits, content-transfer, sync-initial, sync-exchange, sync-media, sync-stop, sync-recovery, sync-conflicts, sync-revocation, sync-expiration, sync-quota, desktop-startup, desktop-pair, build-only]
        default: all
        required: false
      sync_cold_originals:
        description: 'On sync-conflicts only, verify the new native cold original-decision UI on the selected APK'
        type: boolean
        default: false
        required: false
      sync_semantic_preview:
        description: 'On sync-conflicts only, one native Android accessibility activation for Preview merge; not physical touch proof'
        type: boolean
        default: false
        required: false
      sync_webview_preview:
        description: 'On sync-conflicts or sync-revocation, one admitted software Chromium touch for Preview merge; no JS click or direct IPC'
        type: boolean
        default: false
        required: false
      sync_webview_cycle:
        description: 'On sync-conflicts or sync-revocation with WebView preview, one actual software WebView touch per original cycle; no input retry'
        type: boolean
        default: false
        required: false
      sync_revocation_refresh_only:
        description: 'On sync-revocation with WebView preview only, check remaining refresh/cold without repeating the accepted cycle'
        type: boolean
        default: false
        required: false
      sync_original_native_outcome:
        description: 'On the fixed sync-conflicts scope only, verify real stale refusal and hold original native completion through owned stop/cold read'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    if: github.event_name != 'workflow_dispatch' || (inputs.apk_run_id == '' && inputs.runtime_scope != 'lifecycle-remaining' && inputs.runtime_scope != 'lifecycle-editor-remaining' && inputs.runtime_scope != 'local-references' && inputs.runtime_scope != 'auth' && inputs.runtime_scope != 'auth-recovery' && inputs.runtime_scope != 'auth-background' && inputs.runtime_scope != 'auth-certificate' && inputs.runtime_scope != 'attachments' && inputs.runtime_scope != 'attachments-remaining' && inputs.runtime_scope != 'canvas-remaining' && inputs.runtime_scope != 'editing-remaining' && inputs.runtime_scope != 'canvas-tools' && inputs.runtime_scope != 'canvas-tablet' && inputs.runtime_scope != 'document-limits' && inputs.runtime_scope != 'document-export' && inputs.runtime_scope != 'write-interruption' && inputs.runtime_scope != 'file-actions' && inputs.runtime_scope != 'file-actions-remaining' && inputs.runtime_scope != 'canvas-file-delete' && inputs.runtime_scope != 'note-search' && inputs.runtime_scope != 'canvas-properties' && inputs.runtime_scope != 'canvas-properties-remaining' && inputs.runtime_scope != 'canvas-graph' && inputs.runtime_scope != 'canvas-graph-remaining' && inputs.runtime_scope != 'canvas-motion' && inputs.runtime_scope != 'canvas-view' && inputs.runtime_scope != 'canvas-view-remaining' && inputs.runtime_scope != 'canvas-view-cold' && inputs.runtime_scope != 'offline-pending' && inputs.runtime_scope != 'offline-pending-final' && inputs.runtime_scope != 'offline-limits' && inputs.runtime_scope != 'content-transfer' && inputs.runtime_scope != 'sync-initial' && inputs.runtime_scope != 'sync-exchange' && inputs.runtime_scope != 'sync-media' && inputs.runtime_scope != 'sync-stop' && inputs.runtime_scope != 'sync-recovery' && inputs.runtime_scope != 'sync-conflicts' && inputs.runtime_scope != 'sync-revocation' && inputs.runtime_scope != 'sync-expiration' && inputs.runtime_scope != 'sync-quota' && inputs.runtime_scope != 'desktop-startup' && inputs.runtime_scope != 'desktop-pair')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/android-target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@10.28.0 --activate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install the fixed Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          manager="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ -x "$manager/android" ]]; then
            for package in platforms/android-36 build-tools/36.0.0 ndk/30.0.16248370; do
              "$manager/android" --no-metrics --sdk="$ANDROID_HOME" sdk --ignore-outdated-xmls install "$package"
            done
          else
            "$manager/sdkmanager" --sdk_root="$ANDROID_HOME" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370' </dev/null
          fi
          test -f "$ANDROID_HOME/ndk/30.0.16248370/source.properties"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Check mobile boundaries and packaging verification
        run: |
          pnpm --dir frontend test mobile/src
          python3 -m unittest discover -s scripts -p test_verify_android_package.py -v
          python3 -m unittest discover -s scripts -p test_android_release_manifest.py -v
          python3 -m unittest discover -s scripts -p test_android_runtime_probe.py -v
      - name: Freeze the checkout before compiling
        run: python3 scripts/record-build-source.py --commit "$GITHUB_SHA"
      - name: Build both native Android ABIs
        working-directory: frontend
        run: pnpm android build --debug --target aarch64 x86_64 --features custom-protocol --apk --ci
      - name: Compile device Keystore tests against the same built native application
        working-directory: frontend/mobile/src-tauri/gen/android
        run: >-
          ./gradlew --no-daemon --max-workers=2 :app:assembleUniversalDebugAndroidTest
          -x :app:rustBuildUniversalDebug
          -PabiList=arm64-v8a,x86_64 -ParchList=arm64,x86_64 -PtargetList=aarch64,x86_64
      - name: Verify actual APK bytes, identity, signing and compiled libraries
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(frontend/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk)
          test "${#apks[@]}" -eq 1
          test_apks=(frontend/mobile/src-tauri/gen/android/app/build/outputs/apk/androidTest/universal/debug/*.apk)
          test "${#test_apks[@]}" -eq 1
          python3 scripts/verify_android_package.py --commit "$GITHUB_SHA" \
            --source-proof ".build/source-provenance/$GITHUB_SHA.json" \
            --apk "${apks[0]}" --instrumentation-apk "${test_apks[0]}" --native-dir "$CARGO_TARGET_DIR" --sdk "$ANDROID_HOME" \
            --output .build/android-package-proof/package-verification.json
          cp "${apks[0]}" .build/android-package-proof/OpenNexus-android-debug.apk
          cp "${test_apks[0]}" .build/android-package-proof/OpenNexus-android-tests.apk
          cp ".build/source-provenance/$GITHUB_SHA.json" .build/android-package-proof/source-provenance.json
          cp frontend/mobile/src-tauri/gen/android/app/build/reports/platform-verifier/origin.json .build/android-package-proof/platform-verifier-origin.json
      - uses: actions/upload-artifact@v7
        with:
          name: OpenNexus-android-debug-${{ github.sha }}
          path: .build/android-package-proof/
          if-no-files-found: error

  emulator-runtime:
    name: ${{ matrix.scene && format('emulator-runtime ({0})', matrix.scene) || 'emulator-runtime' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # Independent still-pending offline scenes get separate fresh hosted runners.
        # Every existing single-scope run keeps its original job and artifact names.
        scene: ${{ fromJSON(inputs.runtime_scope == 'offline-pending' && '["note-search","file-actions-remaining"]' || inputs.runtime_scope == 'offline-pending-final' && '["note-search","canvas-file-delete"]' || inputs.runtime_scope == 'offline-limits' && '["document-limits","write-interruption"]' || inputs.runtime_scope == 'content-transfer' && '["canvas-remaining","document-export"]' || '[""]') }}
    needs: debug-apk
    if: ${{ always() && !cancelled() && inputs.runtime_scope != 'desktop-startup' && inputs.runtime_scope != 'desktop-pair' && inputs.runtime_scope != 'build-only' && (needs.debug-apk.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.apk_run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OWNED_RUNTIME_SCOPE: ${{ matrix.scene || inputs.runtime_scope || 'all' }}
      COMPILED_SHA: ${{ inputs.apk_commit || github.sha }}
      APK_BUILD_RUN_ID: ${{ inputs.apk_run_id || github.run_id }}
      ANDROID_AVD_HOME: ${{ github.workspace }}/.build/android-runtime/avd
      ANDROID_EMULATOR_HOME: ${{ github.workspace }}/.build/android-runtime/emulator-home
    steps:
      - uses: actions/checkout@v7
      - name: Validate the immutable reuse selection
        env:
          REUSE_RUN: ${{ inputs.apk_run_id }}
          REUSE_COMMIT: ${{ inputs.apk_commit }}
          RUNTIME_SCOPE: ${{ env.OWNED_RUNTIME_SCOPE }}
          ORIGINAL_NATIVE_OUTCOME: ${{ inputs.sync_original_native_outcome }}
          COLD_ORIGINALS: ${{ inputs.sync_cold_originals }}
          SEMANTIC_PREVIEW: ${{ inputs.sync_semantic_preview }}
          WEBVIEW_PREVIEW: ${{ inputs.sync_webview_preview }}
          WEBVIEW_CYCLE: ${{ inputs.sync_webview_cycle }}
          REVOCATION_REFRESH_ONLY: ${{ inputs.sync_revocation_refresh_only }}
        run: |
          python3 - <<'PY'
          import os,re
          run,commit=os.environ['REUSE_RUN'],os.environ['REUSE_COMMIT']
          scope=os.environ['RUNTIME_SCOPE']
          assert scope in ('all','lifecycle','lifecycle-remaining','lifecycle-editor-remaining','local-references','tablet','auth','auth-recovery','auth-background','auth-certificate','attachments','attachments-remaining','canvas-remaining','editing-remaining','canvas-tools','canvas-tablet','performance','document-limits','document-export','storage-recovery','canvas-storage-recovery','canvas-properties','canvas-properties-remaining','write-interruption','file-actions','file-actions-remaining','canvas-file-delete','note-search','canvas-graph','canvas-graph-remaining','canvas-motion','canvas-view','canvas-view-remaining','canvas-view-cold','sync-initial','sync-exchange','sync-media','sync-stop','sync-recovery','sync-conflicts','sync-revocation','sync-expiration','sync-quota')
          assert scope=='all' or bool(run), 'Partial scope requires a fixed existing APK; it is not full acceptance'
          assert bool(run)==bool(commit), 'Supply both immutable APK reuse fields together'
          if run:
            assert re.fullmatch(r'[1-9][0-9]{0,17}',run) and re.fullmatch(r'[0-9a-f]{40}',commit), 'Invalid fixed APK selection'
          if os.environ.get('SEMANTIC_PREVIEW')=='true':
            assert scope=='sync-conflicts' and os.environ.get('WEBVIEW_PREVIEW')!='true'
          if os.environ.get('WEBVIEW_PREVIEW')=='true':
            assert scope in ('sync-conflicts','sync-revocation','sync-expiration','sync-quota')
          if os.environ.get('WEBVIEW_CYCLE')=='true':
            assert scope=='sync-conflicts' or scope in ('sync-revocation','sync-expiration','sync-quota') and os.environ.get('WEBVIEW_PREVIEW')=='true'
          if os.environ.get('REVOCATION_REFRESH_ONLY')=='true':
            assert scope=='sync-revocation' and os.environ.get('WEBVIEW_PREVIEW')=='true' and os.environ.get('WEBVIEW_CYCLE')!='true'
          if os.environ.get('ORIGINAL_NATIVE_OUTCOME')=='true':
            assert scope=='sync-conflicts'
            assert all(os.environ.get(key)=='true' for key in ('COLD_ORIGINALS','WEBVIEW_PREVIEW','WEBVIEW_CYCLE'))
            import sys
            sys.path.insert(0,'scripts')
            from android_product_pair_clients import FixedClientError,original_outcome_client
            try:original_outcome_client(commit,run)
            except FixedClientError:assert False,'Original native outcome requires an admitted immutable client'
          PY
      - name: Check remaining Canvas view contracts without executing input
        if: inputs.runtime_scope == 'canvas-view' || inputs.runtime_scope == 'canvas-view-remaining' || inputs.runtime_scope == 'canvas-view-cold'
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 -m unittest discover -s scripts -p 'test_android_canvas_view_*.py' -v
          node --max-old-space-size=128 --test --test-concurrency=1 scripts/android-runtime-tests/canvas_view_expression.test.mjs
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMPILED_SHA }}
          path: .build/android-runtime/compiled-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v8
        with:
          name: OpenNexus-android-debug-${{ env.COMPILED_SHA }}
          run-id: ${{ env.APK_BUILD_RUN_ID }}
          github-token: ${{ github.token }}
          path: .build/android-runtime/package
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/checkout@v7
        if: inputs.runtime_scope == 'auth' || inputs.runtime_scope == 'auth-recovery' || inputs.runtime_scope == 'auth-background' || inputs.runtime_scope == 'auth-certificate' || inputs.runtime_scope == 'sync-initial' || inputs.runtime_scope == 'sync-exchange' || inputs.runtime_scope == 'sync-media' || inputs.runtime_scope == 'sync-stop' || inputs.runtime_scope == 'sync-recovery' || inputs.runtime_scope == 'sync-conflicts' || inputs.runtime_scope == 'sync-revocation' || inputs.runtime_scope == 'sync-expiration' || inputs.runtime_scope == 'sync-quota'
        with:
          repository: KiriAky107/Sync-for-OpenNexus
          ref: 29e2e6d373ea752352981bdad05d34a7a0d9c3d9
          path: .build/android-auth-source
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: inputs.runtime_scope == 'auth' || inputs.runtime_scope == 'auth-recovery' || inputs.runtime_scope == 'auth-background' || inputs.runtime_scope == 'auth-certificate' || inputs.runtime_scope == 'sync-initial' || inputs.runtime_scope == 'sync-exchange' || inputs.runtime_scope == 'sync-media' || inputs.runtime_scope == 'sync-stop' || inputs.runtime_scope == 'sync-recovery' || inputs.runtime_scope == 'sync-conflicts' || inputs.runtime_scope == 'sync-revocation' || inputs.runtime_scope == 'sync-expiration' || inputs.runtime_scope == 'sync-quota'
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        if: inputs.runtime_scope == 'auth' || inputs.runtime_scope == 'auth-recovery' || inputs.runtime_scope == 'auth-background' || inputs.runtime_scope == 'auth-certificate' || inputs.runtime_scope == 'sync-initial' || inputs.runtime_scope == 'sync-exchange' || inputs.runtime_scope == 'sync-media' || inputs.runtime_scope == 'sync-stop' || inputs.runtime_scope == 'sync-recovery' || inputs.runtime_scope == 'sync-conflicts' || inputs.runtime_scope == 'sync-revocation' || inputs.runtime_scope == 'sync-expiration' || inputs.runtime_scope == 'sync-quota'
      - name: Prepare only the fixed owned HTTPS service
        if: inputs.runtime_scope == 'auth' || inputs.runtime_scope == 'auth-recovery' || inputs.runtime_scope == 'auth-background' || inputs.runtime_scope == 'auth-certificate'
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project .build/android-auth-source
          if [ "$OWNED_RUNTIME_SCOPE" = "auth-certificate" ]; then
            python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
            python3 -m unittest discover -s scripts -p test_android_certificate_probe.py -v
          fi
          python3 -m unittest discover -s scripts -p 'test_android_auth_*.py' -v
          mkdir -p .build/android-auth-origin-proof
          .build/android-auth-source/.venv/bin/python scripts/android_auth_hosted.py prepare > .build/android-auth-origin-proof/origin.json
      - name: Prepare the independent fixed Sync interoperability origin
        if: inputs.runtime_scope == 'sync-initial' || inputs.runtime_scope == 'sync-exchange' || inputs.runtime_scope == 'sync-media' || inputs.runtime_scope == 'sync-stop' || inputs.runtime_scope == 'sync-recovery' || inputs.runtime_scope == 'sync-conflicts' || inputs.runtime_scope == 'sync-revocation' || inputs.runtime_scope == 'sync-expiration' || inputs.runtime_scope == 'sync-quota'
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project .build/android-auth-source
          mkdir -p .build/android-sync-origin-proof
          if [ "$OWNED_RUNTIME_SCOPE" = "sync-revocation" ] || [ "$OWNED_RUNTIME_SCOPE" = "sync-expiration" ] || [ "$OWNED_RUNTIME_SCOPE" = "sync-quota" ]; then
            python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
            python3 -m unittest discover -s scripts -p 'test_android_sync_rejection*.py' -v
            python3 -m unittest discover -s scripts -p 'test_android_sync_expiration.py' -v
            python3 -m unittest discover -s scripts -p 'test_android_sync_quota.py' -v
          fi
          .build/android-auth-source/.venv/bin/python scripts/android_auth_hosted.py prepare --fixture ${{ inputs.runtime_scope == 'sync-quota' && 'sync-quota' || inputs.runtime_scope == 'sync-expiration' && 'sync-expiration' || 'sync' }} > .build/android-sync-origin-proof/origin.json
      - name: Prepare an exclusive hosted emulator
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_EMULATOR_HOME"
          # The headless QEMU binary still links libpulse.so.0 on the hosted image.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          manager="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ -x "$manager/android" ]]; then
            for package in platforms/android-36 build-tools/36.0.0 platform-tools emulator system-images/android-36/google_apis/x86_64; do
              "$manager/android" --no-metrics --sdk="$ANDROID_HOME" sdk --ignore-outdated-xmls install "$package"
            done
          else
            "$manager/sdkmanager" --sdk_root="$ANDROID_HOME" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-36;google_apis;x86_64' </dev/null
          fi
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          # Use the official launcher, which configures its bundled library paths.
          # Running ldd directly on QEMU incorrectly reports bundled Qt/emu libraries missing.
          "$ANDROID_HOME/emulator/emulator" -version > .build/android-runtime/emulator-version.txt 2>&1
          "$ANDROID_HOME/emulator/emulator" -accel-check
          printf 'no\n' | "$manager/avdmanager" create avd --name "opennexus-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --package 'system-images;android-36;google_apis;x86_64' --device pixel_7
          "$ANDROID_HOME/emulator/emulator" -avd "opennexus-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -port 5562 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -accel on -memory 2048 -cores 2 > .build/android-runtime/emulator.log 2>&1 &
          echo "$!" > .build/android-runtime/emulator.pid
      - name: Check original local reference observation boundaries
        if: env.OWNED_RUNTIME_SCOPE == 'local-references'
        run: |
          python3 -m unittest discover -s scripts -p test_android_reference_contract.py -v
          python3 -m unittest discover -s scripts -p test_android_reference_probe.py -v
          python3 -m unittest discover -s scripts -p test_android_reference_workflow.py -v
      - name: Check owned editor title and focus readiness
        if: env.OWNED_RUNTIME_SCOPE == 'lifecycle-editor-remaining'
        run: python3 -m unittest discover -s scripts -p test_android_editor_readiness.py -v
      - name: Check long-note measurement boundaries without starting a client
        if: env.OWNED_RUNTIME_SCOPE == 'performance'
        run: python3 -m unittest discover -s scripts -p test_android_performance_probe.py -v
      - name: Check the remaining original property forms
        if: env.OWNED_RUNTIME_SCOPE == 'canvas-properties' || env.OWNED_RUNTIME_SCOPE == 'canvas-properties-remaining'
        run: |
          python3 -m unittest discover -s scripts -p test_android_canvas_properties.py -v
          python3 -m unittest discover -s scripts -p test_android_canvas_properties_probe.py -v
      - name: Check bounded filesystem ownership and original recovery invariants
        if: env.OWNED_RUNTIME_SCOPE == 'storage-recovery' || env.OWNED_RUNTIME_SCOPE == 'canvas-storage-recovery'
        run: |
          python3 -m unittest discover -s scripts -p test_android_storage_probe.py -v
          python3 -m unittest discover -s scripts -p test_android_canvas_storage_probe.py -v
      - name: Check original OS-interruption and receipt boundaries
        if: env.OWNED_RUNTIME_SCOPE == 'write-interruption'
