  android-desktop-pair:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_scope == 'desktop-pair'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      COMPILED_SHA: ${{ inputs.apk_commit || github.sha }}
      APK_BUILD_RUN_ID: ${{ inputs.apk_run_id || github.run_id }}
      ANDROID_AVD_HOME: ${{ github.workspace }}/.build/android-runtime/avd
      ANDROID_EMULATOR_HOME: ${{ github.workspace }}/.build/android-runtime/emulator-home
    steps:
    - uses: actions/checkout@v7
    - name: Validate the immutable reuse selection
      env:
        REUSE_RUN: ${{ inputs.apk_run_id }}
        REUSE_COMMIT: ${{ inputs.apk_commit }}
        RUNTIME_SCOPE: ${{ inputs.runtime_scope || 'all' }}
      run: 'python3 - <<''PY''

        import os

        import sys

        sys.path.insert(0,''scripts'')

        from android_product_pair_clients import fixed_android_client

        fixed_android_client(os.environ[''REUSE_COMMIT''],os.environ[''REUSE_RUN''])

        assert os.environ[''RUNTIME_SCOPE'']==''desktop-pair''

        assert os.environ[''GITHUB_RUN_ATTEMPT'']==''1''

        PY

        echo "PAIR_TOOLS_SHORT=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

        '
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.COMPILED_SHA }}
        path: .build/android-runtime/compiled-source
        persist-credentials: 'false'
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/download-artifact@v8
      with:
        name: OpenNexus-android-debug-${{ env.COMPILED_SHA }}
        run-id: ${{ env.APK_BUILD_RUN_ID }}
        github-token: ${{ github.token }}
        path: .build/android-runtime/package
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - uses: actions/checkout@v7
      with:
        repository: KiriAky107/Sync-for-OpenNexus
        ref: 29e2e6d373ea752352981bdad05d34a7a0d9c3d9
        path: .build/android-auth-source
        persist-credentials: 'false'
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
    - name: Prepare the independent fixed Sync interoperability origin
      shell: bash
      run: 'set -euo pipefail

        uv sync --frozen --project .build/android-auth-source

        mkdir -p .build/android-sync-origin-proof

        .build/android-auth-source/.venv/bin/python scripts/android_auth_hosted.py prepare --fixture sync > .build/android-sync-origin-proof/origin.json

        '
    - name: Prepare an exclusive hosted emulator
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_ACTIONS\" = true\ntest \"$RUNNER_ENVIRONMENT\" = github-hosted\ntest \"$RUNNER_OS\" = Linux\nmkdir\
        \ -p \"$ANDROID_AVD_HOME\" \"$ANDROID_EMULATOR_HOME\"\n# The headless QEMU binary still links libpulse.so.0 on the hosted image.\nsudo apt-get\
        \ update -qq\nsudo apt-get install -y --no-install-recommends libpulse0\nmanager=\"$ANDROID_HOME/cmdline-tools/latest/bin\"\nif [[ -x \"\
        $manager/android\" ]]; then\n  for package in platforms/android-36 build-tools/36.0.0 platform-tools emulator system-images/android-36/google_apis/x86_64;\
        \ do\n    \"$manager/android\" --no-metrics --sdk=\"$ANDROID_HOME\" sdk --ignore-outdated-xmls install \"$package\"\n  done\nelse\n  \"\
        $manager/sdkmanager\" --sdk_root=\"$ANDROID_HOME\" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-36;google_apis;x86_64'\
        \ </dev/null\nfi\ntest -c /dev/kvm\nsudo setfacl -m \"u:$(id -un):rw\" /dev/kvm\n# Use the official launcher, which configures its bundled\
        \ library paths.\n# Running ldd directly on QEMU incorrectly reports bundled Qt/emu libraries missing.\n\"$ANDROID_HOME/emulator/emulator\"\
        \ -version > .build/android-runtime/emulator-version.txt 2>&1\n\"$ANDROID_HOME/emulator/emulator\" -accel-check\nprintf 'no\\n' | \"$manager/avdmanager\"\
        \ create avd --name \"opennexus-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\" --package 'system-images;android-36;google_apis;x86_64' --device\
        \ pixel_7\n\"$ANDROID_HOME/emulator/emulator\" -avd \"opennexus-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\" -port 5562 -no-window -no-audio\
        \ -no-snapshot -no-boot-anim -gpu swiftshader -accel on -memory 2048 -cores 2 > .build/android-runtime/emulator.log 2>&1 &\necho \"$!\"\
        \ > .build/android-runtime/emulator.pid\n"
    - name: Install an isolated tool overlay from existing frozen backend wheels
      shell: bash
      run: 'set -euo pipefail

        mkdir -p .build/android-product-pair

        python3 scripts/android_pair_crypto_requirements.py > .build/android-product-pair/crypto.requirements.txt

        uv pip install --python .build/android-auth-source/.venv/bin/python --target .build/android-pair-crypto --no-deps --require-hashes --only-binary
        :all: --requirement .build/android-product-pair/crypto.requirements.txt

        '
    - name: Run the actual original Android first stage
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PYTHONPATH: ${{ github.workspace }}/.build/android-pair-crypto
      run: .build/android-auth-source/.venv/bin/python scripts/android_product_pair_linux.py first --commit "$COMPILED_SHA" --tools-commit "$GITHUB_SHA"
        --build-run-id "$APK_BUILD_RUN_ID" --source-checkout .build/android-runtime/compiled-source --bundle .build/android-runtime/package --sdk
        "$ANDROID_HOME" --output .build/android-product-pair/first/evidence
    - name: Publish sealed owned fixture
      uses: actions/upload-artifact@v7
      with:
        name: onx-pair-sealed-${{ github.run_id }}-${{ env.PAIR_TOOLS_SHORT }}
        path: .build/android-runtime/owned-auth-${{ github.run_id }}-${{ github.run_attempt }}/pair-sealed/exchange.json
        if-no-files-found: error
        retention-days: 14
    - name: Run the same original Android incoming and return stage
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PYTHONPATH: ${{ github.workspace }}/.build/android-pair-crypto
      run: .build/android-auth-source/.venv/bin/python scripts/android_product_pair_linux.py returned --commit "$COMPILED_SHA" --tools-commit "$GITHUB_SHA"
        --build-run-id "$APK_BUILD_RUN_ID" --source-checkout .build/android-runtime/compiled-source --bundle .build/android-runtime/package --sdk
        "$ANDROID_HOME" --output .build/android-product-pair/returned/evidence
    - name: Publish original Android return
      uses: actions/upload-artifact@v7
      with:
        name: onx-pair-android-return-${{ github.run_id }}-${{ env.PAIR_TOOLS_SHORT }}
        path: .build/android-runtime/owned-auth-${{ github.run_id }}-${{ github.run_attempt }}/pair-android-return/exchange.json
        if-no-files-found: error
        retention-days: 14
    - name: Verify the actual original Desktop cold receipt and PG/S3 bytes
      env:
        GITHUB_TOKEN: ${{ github.token }}
