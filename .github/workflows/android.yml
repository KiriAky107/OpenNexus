name: Android

on:
  push:
    branches: [main]
    paths:
      - 'frontend/mobile/**'
      - 'frontend/src-tauri/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'scripts/*android*'
      - 'scripts/android-runtime/**'
      - 'frontend/src/features/editor/canvasModel.ts'
      - 'frontend/src/features/editor/canvasGeometry.ts'
      - 'frontend/src/services/workspaceDocuments.ts'
      - 'frontend/src/services/vaultReferences.ts'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/mobile/**'
      - 'frontend/src-tauri/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'scripts/*android*'
      - 'scripts/android-runtime/**'
      - 'frontend/src/features/editor/canvasModel.ts'
      - 'frontend/src/features/editor/canvasGeometry.ts'
      - 'frontend/src/services/workspaceDocuments.ts'
      - 'frontend/src/services/vaultReferences.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/android-target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@10.28.0 --activate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install the fixed Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          manager="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ -x "$manager/android" ]]; then
            for package in platforms/android-36 build-tools/36.0.0 ndk/30.0.16248370; do
              "$manager/android" --no-metrics --sdk="$ANDROID_HOME" sdk --ignore-outdated-xmls install "$package"
            done
          else
            "$manager/sdkmanager" --sdk_root="$ANDROID_HOME" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370' </dev/null
          fi
          test -f "$ANDROID_HOME/ndk/30.0.16248370/source.properties"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Check mobile boundaries and packaging verification
        run: |
          pnpm --dir frontend test mobile/src
          python3 -m unittest discover -s scripts -p test_verify_android_package.py -v
          python3 -m unittest discover -s scripts -p test_android_runtime_probe.py -v
      - name: Freeze the checkout before compiling
        run: python3 scripts/record-build-source.py --commit "$GITHUB_SHA"
      - name: Build both native Android ABIs
        working-directory: frontend
        run: pnpm android build --debug --target aarch64 x86_64 --features custom-protocol --apk --ci
      - name: Verify actual APK bytes, identity, signing and compiled libraries
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(frontend/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk)
          test "${#apks[@]}" -eq 1
          python3 scripts/verify_android_package.py --commit "$GITHUB_SHA" \
            --source-proof ".build/source-provenance/$GITHUB_SHA.json" \
            --apk "${apks[0]}" --native-dir "$CARGO_TARGET_DIR" --sdk "$ANDROID_HOME" \
            --output .build/android-package-proof/package-verification.json
          cp "${apks[0]}" .build/android-package-proof/OpenNexus-android-debug.apk
          cp ".build/source-provenance/$GITHUB_SHA.json" .build/android-package-proof/source-provenance.json
      - uses: actions/upload-artifact@v7
        with:
          name: OpenNexus-android-debug-${{ github.sha }}
          path: .build/android-package-proof/
          if-no-files-found: error

  emulator-runtime:
    needs: debug-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.build/android-runtime/avd
      ANDROID_EMULATOR_HOME: ${{ github.workspace }}/.build/android-runtime/emulator-home
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v8
        with:
          name: OpenNexus-android-debug-${{ github.sha }}
          path: .build/android-runtime/package
      - name: Prepare an exclusive hosted emulator
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_EMULATOR_HOME"
          manager="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ -x "$manager/android" ]]; then
            for package in platforms/android-36 build-tools/36.0.0 platform-tools emulator system-images/android-36/google_apis/x86_64; do
              "$manager/android" --no-metrics --sdk="$ANDROID_HOME" sdk --ignore-outdated-xmls install "$package"
            done
          else
            "$manager/sdkmanager" --sdk_root="$ANDROID_HOME" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-36;google_apis;x86_64' </dev/null
          fi
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          printf 'no\n' | "$manager/avdmanager" create avd --name "opennexus-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --package 'system-images;android-36;google_apis;x86_64' --device pixel_7
          "$ANDROID_HOME/emulator/emulator" -version > .build/android-runtime/emulator-version.txt 2>&1
          "$ANDROID_HOME/emulator/emulator" -avd "opennexus-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -port 5562 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -accel on -memory 2048 -cores 2 > .build/android-runtime/emulator.log 2>&1 &
          echo "$!" > .build/android-runtime/emulator.pid
      - name: Check real APK editing, force-stop recovery, Canvas touch and system export
        run: >-
          python3 scripts/android_runtime_probe.py --commit "$GITHUB_SHA"
          --bundle .build/android-runtime/package --sdk "$ANDROID_HOME"
          --output .build/android-runtime/evidence
      - name: Stop only this job's emulator
        if: always()
        shell: bash
        run: |
          if [[ -x "$ANDROID_HOME/platform-tools/adb" ]]; then
            owned_name=$("$ANDROID_HOME/platform-tools/adb" -s emulator-5562 emu avd name 2>/dev/null | head -n 1 | tr -d '\r')
            if [[ "$owned_name" = "opennexus-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]]; then
              "$ANDROID_HOME/platform-tools/adb" -s emulator-5562 emu kill
            fi
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: OpenNexus-android-runtime-${{ github.sha }}
          path: |
            .build/android-runtime/evidence/
            .build/android-runtime/emulator.log
            .build/android-runtime/emulator-version.txt
          if-no-files-found: warn
