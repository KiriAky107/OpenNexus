        run: >-
          python3 scripts/android_runtime_probe.py --commit "$COMPILED_SHA"
          --source-checkout .build/android-runtime/compiled-source --tools-commit "$GITHUB_SHA"
          --build-run-id "$APK_BUILD_RUN_ID"
          --scope "${{ env.OWNED_RUNTIME_SCOPE }}"
          --bundle .build/android-runtime/package --sdk "$ANDROID_HOME"
          --output .build/android-runtime/evidence
      - name: Check actual native HTTPS sign-in, cold resume and original auth outcomes
        if: inputs.runtime_scope == 'auth' || inputs.runtime_scope == 'auth-recovery' || inputs.runtime_scope == 'auth-background' || inputs.runtime_scope == 'auth-certificate'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTH_PROBE_SCOPE: ${{ inputs.runtime_scope == 'auth-certificate' && 'certificate' || inputs.runtime_scope == 'auth-background' && 'background' || inputs.runtime_scope == 'auth-recovery' && 'recovery' || 'all' }}
        run: >-
