      run: .build/android-auth-source/.venv/bin/python scripts/android_product_pair_linux.py final --commit "$COMPILED_SHA" --tools-commit "$GITHUB_SHA"
        --build-run-id "$APK_BUILD_RUN_ID" --source-checkout .build/android-runtime/compiled-source --bundle .build/android-runtime/package --sdk
        "$ANDROID_HOME" --output .build/android-product-pair/final/evidence
    - name: Stop only the original paired emulator
      if: always()
