      run: 'mkdir -p .build/android-sync-origin-proof

        python3 scripts/android_auth_hosted.py stop --fixture sync > .build/android-sync-origin-proof/cleanup.json

        '
    - name: Preserve bounded Android pair evidence without private tools or databases
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: OpenNexus-android-product-pair-${{ env.COMPILED_SHA }}
        path: '.build/android-product-pair/*/evidence/

          .build/android-sync-origin-proof/

          '
        if-no-files-found: warn
        retention-days: 14
  desktop-pair:
