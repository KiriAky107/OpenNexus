          uv pip install --python .build/android-auth-source/.venv/bin/python --target .build/android-original-outcome-crypto --no-deps --require-hashes --only-binary :all: --requirement .build/android-original-outcome-tool/crypto.requirements.txt
      - name: Check actual Android UI association and original foreground Sync exchange
        if: inputs.runtime_scope == 'sync-initial' || inputs.runtime_scope == 'sync-exchange' || inputs.runtime_scope == 'sync-media' || inputs.runtime_scope == 'sync-stop' || inputs.runtime_scope == 'sync-recovery' || inputs.runtime_scope == 'sync-conflicts' || inputs.runtime_scope == 'sync-revocation' || inputs.runtime_scope == 'sync-expiration' || inputs.runtime_scope == 'sync-quota'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ inputs.sync_original_native_outcome && format('{0}/.build/android-original-outcome-crypto', github.workspace) || '' }}
        run: >-
          .build/android-auth-source/.venv/bin/python scripts/android_sync_runtime.py
          --commit "$COMPILED_SHA" --source-checkout .build/android-runtime/compiled-source
          --tools-commit "$GITHUB_SHA" --build-run-id "$APK_BUILD_RUN_ID"
          --bundle .build/android-runtime/package --sdk "$ANDROID_HOME"
          --output .build/android-sync-evidence
          ${{ inputs.runtime_scope == 'sync-quota' && '--quota' || inputs.runtime_scope == 'sync-expiration' && '--expiration' || inputs.runtime_scope == 'sync-revocation' && '--revocation' || inputs.runtime_scope == 'sync-conflicts' && '--conflicts' || inputs.runtime_scope == 'sync-recovery' && '--recovery' || inputs.runtime_scope == 'sync-stop' && '--stop' || inputs.runtime_scope == 'sync-media' && '--media' || inputs.runtime_scope == 'sync-exchange' && '--exchange' || '' }}
          ${{ inputs.sync_cold_originals && '--cold-originals' || '' }}
          ${{ inputs.sync_semantic_preview && '--semantic-preview' || '' }}
          ${{ inputs.sync_webview_preview && '--webview-preview' || '' }}
          ${{ inputs.sync_webview_cycle && '--webview-cycle' || '' }}
          ${{ inputs.sync_revocation_refresh_only && '--revocation-refresh-only' || '' }}
          ${{ inputs.sync_original_native_outcome && '--original-native-outcome' || '' }}
      - name: Stop only this job's emulator
        if: always()
        run: python3 scripts/android_runtime_probe.py --sdk "$ANDROID_HOME" --stop-owned
      - name: Stop only this job's original HTTPS origin and providers
        if: always() && (inputs.runtime_scope == 'auth' || inputs.runtime_scope == 'auth-recovery' || inputs.runtime_scope == 'auth-background' || inputs.runtime_scope == 'auth-certificate')
        shell: bash
        run: |
          mkdir -p .build/android-auth-origin-proof
          python3 scripts/android_auth_hosted.py stop > .build/android-auth-origin-proof/cleanup.json
      - name: Stop only this job's original Sync interoperability origin and providers
        if: always() && (inputs.runtime_scope == 'sync-initial' || inputs.runtime_scope == 'sync-exchange' || inputs.runtime_scope == 'sync-media' || inputs.runtime_scope == 'sync-stop' || inputs.runtime_scope == 'sync-recovery' || inputs.runtime_scope == 'sync-conflicts' || inputs.runtime_scope == 'sync-revocation' || inputs.runtime_scope == 'sync-expiration' || inputs.runtime_scope == 'sync-quota')
        shell: bash
        run: |
          mkdir -p .build/android-sync-origin-proof
          python3 scripts/android_auth_hosted.py stop --fixture sync > .build/android-sync-origin-proof/cleanup.json
      - uses: actions/upload-artifact@v7
        if: always() && inputs.runtime_scope != 'auth' && inputs.runtime_scope != 'auth-recovery' && inputs.runtime_scope != 'auth-background' && inputs.runtime_scope != 'auth-certificate' && inputs.runtime_scope != 'sync-initial' && inputs.runtime_scope != 'sync-exchange' && inputs.runtime_scope != 'sync-media' && inputs.runtime_scope != 'sync-stop' && inputs.runtime_scope != 'sync-recovery' && inputs.runtime_scope != 'sync-conflicts' && inputs.runtime_scope != 'sync-revocation' && inputs.runtime_scope != 'sync-expiration' && inputs.runtime_scope != 'sync-quota'
        with:
          name: ${{ matrix.scene && format('OpenNexus-android-runtime-{0}-{1}', matrix.scene, env.COMPILED_SHA) || format('OpenNexus-android-runtime-{0}', env.COMPILED_SHA) }}
          path: |
            .build/android-runtime/evidence/
            .build/android-runtime/emulator.log
            .build/android-runtime/emulator-version.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always() && (inputs.runtime_scope == 'sync-initial' || inputs.runtime_scope == 'sync-exchange' || inputs.runtime_scope == 'sync-media' || inputs.runtime_scope == 'sync-stop' || inputs.runtime_scope == 'sync-recovery' || inputs.runtime_scope == 'sync-conflicts' || inputs.runtime_scope == 'sync-revocation' || inputs.runtime_scope == 'sync-expiration' || inputs.runtime_scope == 'sync-quota')
        with:
