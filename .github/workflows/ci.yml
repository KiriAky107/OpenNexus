name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: git diff --check
      - run: python3 scripts/check-doc-links.py
      - run: python3 scripts/test_verify_experiment_package.py
      - run: python3 scripts/test_windows_native_smoke.py
      - run: python3 scripts/check-release-notes.py
      - run: python3 scripts/test_github_release.py
      - run: python3 scripts/test_service_release.py
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 scripts/test_prepare_experiment_runtime.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_EXPORT_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.24'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --frozen
      - run: uv run --frozen python -m compileall -q app
      - run: uv run --frozen pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@10.28.0 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --maxWorkers=2
      - run: pnpm type-check
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.24'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --directory ../../backend
      - run: cargo fmt --check
      # The production-strength repeated-crash migration test runs in release acceptance.
      - run: cargo test --lib --locked -- --skip credentials::tests::b04_migration_survives_twenty_hard_terminations_per_boundary
      - run: cargo clippy --lib --locked -- -D warnings
      - name: Test the offline encryption protocol prototype
        run: 'cargo test --lib --features sync-e2ee-prototype --locked sync_e2ee_prototype::'
      - name: Check prototype primitives and generated-data measurement
        run: cargo clippy --lib --example sync_e2ee_prototype --features sync-e2ee-prototype --locked -- -D warnings
      - name: Measure authenticated streaming and ciphertext quota
        run: |
          mkdir -p ../../.build
          cargo run --quiet --example sync_e2ee_prototype --features sync-e2ee-prototype --locked > ../../.build/sync-e2ee-metrics.json
      - uses: actions/upload-artifact@v7
        with:
          name: sync-e2ee-offline-metrics-${{ github.sha }}
          path: .build/sync-e2ee-metrics.json
          if-no-files-found: error

  windows-host:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            frontend/src-tauri/target
          key: windows-host-msvc-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('frontend/src-tauri/Cargo.lock', 'frontend/src-tauri/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-host-msvc-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('frontend/src-tauri/Cargo.lock', 'frontend/src-tauri/Cargo.toml') }}-
            windows-host-msvc-${{ steps.rust.outputs.cachekey }}-
      - name: Test native watcher, stable identities and workspace recovery
        run: cargo test --lib --locked 'workspace::' -- --nocapture
      - name: Test sync discovery, ordering and peer application
        run: cargo test --lib --locked sync_ -- --nocapture
      - name: Test experiment budgets and container filesystem accounting
        run: cargo test --lib --locked experiment_ -- --nocapture
      - name: Test suspended process ownership and experiment expiry
        run: cargo test --lib --locked 'extension_process::' -- --nocapture
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check out the fixed Sync object protocol fixture
        uses: actions/checkout@v7
        with:
          repository: KiriAky107/Sync-for-OpenNexus
          ref: 8795c4b241aeceac81fc6e9981358f693b09d712
          path: .build/sync-server
          persist-credentials: false
      - name: Check out the fixed Community catalog fixture
        uses: actions/checkout@v7
        with:
          repository: KiriAky107/Community-for-OpenNexus
          ref: 1fcceef408fed0ec96b28b9925a753ffbeaaa449
          path: .build/community-server
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.24'
          enable-cache: true
          cache-dependency-glob: |
            .build/sync-server/uv.lock
            .build/community-server/uv.lock
      - name: Install the fixed isolated Sync fixture
        working-directory: .
        run: uv sync --frozen --directory .build/sync-server
      - name: Install and compare the fixed Community catalog fixture
        working-directory: .
        run: |
          uv sync --frozen --directory .build/community-server
          if ($LASTEXITCODE -ne 0) { throw 'Community fixture installation failed' }
          foreach ($contractName in @('community-v1-catalog.json', 'community-v1-templates.json', 'community-v1-configurations.json')) {
            $desktopContract = Get-FileHash (Join-Path 'frontend/src/services/fixtures' $contractName) -Algorithm SHA256
            $serviceContract = Get-FileHash (Join-Path '.build/community-server/tests/fixtures' $contractName) -Algorithm SHA256
            if ($desktopContract.Hash -ne $serviceContract.Hash) { throw ('Community and Desktop contract bytes differ: ' + $contractName) }
          }
          $coreChecker = Get-FileHash 'backend/app/services/catalog_configuration_manifest.py' -Algorithm SHA256
          $publisherChecker = Get-FileHash '.build/community-server/community/configurations.py' -Algorithm SHA256
          if ($coreChecker.Hash -ne $publisherChecker.Hash) { throw 'Community and Core configuration validators differ' }
      - name: Verify locked embedded Python and native isolation prototype
        working-directory: .
        run: ./scripts/verify-experiment-runtime.ps1
      - name: Test desktop Host vault lifecycle coordination
        run: |
          # These tests never open a WebView. Supply a local static test page
          # for Tauri's asset embedding; the frontend job builds the real UI.
          $testFrontend = [IO.Path]::GetFullPath((Join-Path (Get-Location) '../dist'))
          if (Test-Path -LiteralPath $testFrontend) { throw 'Unexpected existing Host test assets' }
          New-Item -ItemType Directory -Path $testFrontend | Out-Null
          $testIndex = Join-Path $testFrontend 'index.html'
          try {
            Set-Content -LiteralPath $testIndex -Encoding utf8 -Value '<!doctype html><title>Host lifecycle fixture</title>'
            cargo test --bin OpenNexus --features desktop --locked lifecycle_tests:: -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Desktop Host lifecycle tests failed' }
            cargo test --bin OpenNexus --features desktop --locked experiment_commands::tests:: -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Experiment main-window command tests failed' }
            cargo test --lib --features desktop --locked sync_account::tests:: -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Sync account metadata tests failed' }
            cargo test --lib --features desktop --locked sync_auth::tests:: -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Sync device credential scope tests failed' }
            cargo test --lib --features desktop --locked 'extension_store::' -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Installed package state and sealed rollback tests failed' }
            cargo test --lib --features desktop --locked 'extension_candidates::' -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Reviewed persona application and target revision tests failed' }
            cargo test --lib --features desktop --locked 'extension_configuration_broker::' -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Installed configuration broker authority tests failed' }
            cargo test --lib --features desktop --locked 'extension_template_apply::' -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Reviewed template import identity and cancellation tests failed' }
            cargo test --lib --features desktop --locked 'extension_template_apply::tests::imported_template_runs_only_after_independent_approval_and_preserves_origins' -- --ignored --exact --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Native independently approved template execution and artifact provenance failed' }
            cargo test --bin OpenNexus --features desktop --locked 'extension_activation::tests::' -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Native grouped package health and rollback tests failed' }
            cargo test --lib --features desktop --locked 'extension_instance::tests::' -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Native instance generation and cleanup tests failed' }
            $env:OPENNEXUS_COMMUNITY_SERVER_DIR = Join-Path $env:GITHUB_WORKSPACE '.build/community-server'
            cargo test --lib --features desktop --locked 'extension_trust::' -- --include-ignored --skip actual_https_roots_require_trust_hostname_and_validity --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Community Host live verification tests failed' }
            & (Join-Path $env:OPENNEXUS_COMMUNITY_SERVER_DIR '.venv/Scripts/python.exe') ../../scripts/check_community_tls.py
            if ($LASTEXITCODE -ne 0) { throw 'Community HTTPS certificate and redirect validation failed' }
            $env:OPENNEXUS_SYNC_SERVER_DIR = Join-Path $env:GITHUB_WORKSPACE '.build/sync-server'
            cargo test --test experiment_sync --features desktop --locked -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Two-device experiment links and stable identities failed' }
            cargo test --test sync_push --features desktop,sync-e2ee-prototype --locked e2ee_prototype_actual_opaque_storage_resume_dedup_quota_and_offline_bundle -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Ciphertext object storage integration failed' }
          } finally {
            Remove-Item -LiteralPath $testIndex -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $testFrontend -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: experiment-runtime-probe
          include-hidden-files: true
          path: |
            .build/experiment-runtime/probe-result.json
            .build/experiment-runtime/policy-probe-result.json
            .build/experiment-runtime/storage-audit-result.json
            .build/experiment-runtime/write-io-result.json
            .build/experiment-runtime/bound-runtime-result.json
            .build/experiment-runtime/worker-runtime-result.json
            .build/experiment-runtime/signatures.json
          if-no-files-found: warn
