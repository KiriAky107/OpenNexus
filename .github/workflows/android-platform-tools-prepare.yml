name: Android platform-tools prepare

on:
  push:
    branches: [feat/android-sync-foreground]
    paths:
      - .github/workflows/android-platform-tools-prepare.yml
      - scripts/android_release_platform_tools.py
      - scripts/android_release_preconfig_sdk.py
      - scripts/android_release_preconfig_host_resources.py
      - scripts/test_android_release_platform_tools.py
      - scripts/test_android_release_preconfig_prepared_host.py

permissions:
  contents: read

concurrency:
  group: android-platform-tools-prepare-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the affected prepare guards in RAM
        working-directory: scripts
        run: python -B -m unittest test_android_release_platform_tools test_android_release_preconfig_prepared_host
      - name: Bind prepared SDK and host close ownership, probe version once, then remove owned files
        run: |
          mkdir -p .build
          python -B scripts/android_release_platform_tools.py verify
      - name: Preserve only the bounded preparation proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-tools-prepare-${{ github.sha }}-${{ github.run_attempt }}
          path: .build/platform-tools-prepare-proof.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
