[package]
name = "opennexus-mobile"
version = "0.1.0-dev1"
edition = "2021"
rust-version = "1.89"

[lib]
name = "opennexus_mobile"
crate-type = ["cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
notesagent_host = { package = "notesagent-desktop", path = "../../src-tauri", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
notesagent_host = { package = "notesagent-desktop", path = "../../src-tauri", default-features = false, features = ["sync-http"] }
jni = { version = "=0.22.4", default-features = false }
serde_json = "1"
zeroize = "=1.9.0"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
